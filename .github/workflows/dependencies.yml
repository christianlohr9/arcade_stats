name: dependencies

# Updates the renv lockfile once a month and opens a pull request; the ci
# workflow runs the tests on it before anything is merged and deployed.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Update packages
        run: Rscript -e 'renv::update(prompt = FALSE); renv::snapshot(prompt = FALSE)'

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/renv-update
          commit-message: "chore: update R dependencies"
          title: "chore: update R dependencies"
          body: Monthly renv update. Merge once the ci checks pass.
          delete-branch: true
