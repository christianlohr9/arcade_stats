name: dependencies

# Updates R packages in the renv lockfile once a month, runs the tests and
# opens a pull request only if they pass. Pull requests created with the
# workflow token do not trigger other workflows, so the tests run here.
# The R version stays at the lockfile's version, so an R release cannot break
# the shinyapps.io deploy unnoticed.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # renv itself is left out: updating it mid-run leaves renv/activate.R
      # out of sync with the installed version.
      - name: Update packages
        run: Rscript -e 'renv::update(exclude = "renv", prompt = FALSE); renv::snapshot(prompt = FALSE)'

      # Packages come from the Posit Package Manager mirror in CI; record them
      # as CRAN so shinyapps.io resolves them.
      - name: Record CRAN as repository
        run: |
          sed -i 's/"Repository": "RSPM"/"Repository": "CRAN"/' renv.lock

      - name: Run tests
        env:
          NOT_CRAN: "true"
        run: |
          Rscript -e 'renv::install(c("testthat", "shinytest2", "chromote", "withr"), prompt = FALSE)'
          Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/renv-update
          commit-message: "chore: update R dependencies"
          title: "chore: update R dependencies"
          body: Monthly renv update. The tests passed with these versions in the dependencies workflow run; merging deploys them.
          delete-branch: true
