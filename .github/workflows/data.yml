name: data

# Rebuilds the app datasets from nflverse and publishes them to the "data"
# release. The app picks up a new manifest within an hour, no deploy needed.
on:
  schedule:
    # daily during the season (September to February), weekly otherwise
    - cron: "0 9 * 9-12,1-2 *"
    - cron: "0 9 * 3-8 3"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Build and validate datasets
        run: Rscript pipeline/build.R build

      - name: Publish to data release
        run: |
          gh release view data > /dev/null 2>&1 || \
            gh release create data --title "Data" --latest=false \
              --notes "Datasets for the Shiny app, replaced by the data workflow on every run."
          # manifest last, so the app never sees a new manifest with old files
          gh release upload data build/offense.parquet build/defense.parquet --clobber
          gh release upload data build/manifest.json --clobber
          cat build/manifest.json

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling resets that timer.
      - name: Keep schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/data.yml/enable"
