version: '3.8'

services:
  arcade-stats:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3838:3838"
    volumes:
      # Mount data directory to persist data updates
      - ./data:/srv/shiny-server/data
      # Mount logs
      - ./logs:/var/log/shiny-server
    environment:
      - SHINY_LOG_STDERR=1
      - SHINY_LOG_STDOUT=1
    restart: unless-stopped
    container_name: arcade-stats-app

  # Optional: Add a simple nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - arcade-stats
    restart: unless-stopped
    container_name: arcade-stats-nginx
    profiles: ["production"]